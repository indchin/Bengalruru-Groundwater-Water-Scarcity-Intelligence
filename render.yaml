services:
  - type: web
    name: bwi-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run seed
    startCommand: npm start
    healthCheckPath: /api/areas
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: ADMIN_API_KEY
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
